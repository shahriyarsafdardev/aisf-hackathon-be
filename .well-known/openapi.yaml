openapi: 3.0.1
info:
  title: Sphere
  description: Plugin for answering questions using Sphere's high quality resources like publications, technical documentation and media. Use it whenever a user says "Ask Sphere" or asks to access / edit their Sphere settings or content sources
  version: "v1"
servers:
  - url: base_url
paths:
  /query:
    get:
      operationId: getQuery
      summary: Accepts user question/query and returns relevant resources.
      description: Accepts user question/query and returns relevant resources.
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
          description: The full user prompt was inputed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getQueryResponse"
  /content-source-settings:
    get:
      operationId: contentSourceSettings
      summary: Returns the users content source settings.
      description: Returns the users content source settings.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSettingsResponse"

components:
  schemas:
    getQueryResponse:
      type: object
      properties:
        answer:
          type: string
          description: The answer of the query.
    getSettingsResponse:
      type: string
      description: The url for the users content source settings.