openapi: 3.0.1
info:
  title: Hubspot Plugin
  description: A plugin that allows users to get all the contacts and companies from Hubspot.
  version: "v1"
servers:
  - url: https://sphere-aisf-hackathon-be.herokuapp.com
paths:
  /hubspot/contacts:
    get:
      operationId: get_hubspot_contacts
      summary: Get the list of contacts
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHubspotContactsResponse"
  /hubspot/companies:
    get:
      operationId: get_hubspot_companies
      summary: Get the list of companies
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getHubspotCompaniesResponse"
components:
  schemas:
    getHubspotContactsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique ID of the contact.
              createdAt:
                type: string
                format: date-time
                description: Creation date of the contact.
              updatedAt:
                type: string
                format: date-time
                description: Last update date of the contact.
              archived:
                type: boolean
                description: Indicates if the contact is archived.
              properties:
                type: object
                description: Object containing properties of the contact.
                properties:
                  createdate:
                    type: string
                    format: date-time
                    description: Date the contact was created.
                  email:
                    type: string
                    description: Email of the contact.
                  firstname:
                    type: string
                    description: First name of the contact.
                  lastname:
                    type: string
                    description: Last name of the contact.
                  lastmodifieddate:
                    type: string
                    format: date-time
                    description: Date the contact was last modified.
                  hs_object_id:
                    type: string
                    description: ID of the Hubspot object.
          description: The list of contact results.
    getHubspotCompaniesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique ID of the company.
              createdAt:
                type: string
                format: date-time
                description: Creation date of the company.
              updatedAt:
                type: string
                format: date-time
                description: Last update date of the company.
              archived:
                type: boolean
                description: Indicates if the company is archived.
              properties:
                type: object
                description: Object containing properties of the company.
                properties:
                  createdate:
                    type: string
                    format: date-time
                    description: Date at which the company was created.
                  domain:
                    type: string
                    description: Domain of the company.
                  name:
                    type: string
                    description: Name of the company.
                  hs_lastmodifieddate:
                    type: string
                    format: date-time
                    description: Date at which the company was last modified.
                  hs_object_id:
                    type: string
                    description: ID of the Hubspot object.
